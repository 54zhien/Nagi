name: Build unsigned IPA

on:
  workflow_dispatch:
  push:
    branches: [ main ]

jobs:
  build:
    runs-on: macos-15

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Show toolchain
        run: |
          xcodebuild -version
          xcodebuild -showsdks | grep -i ios

      - name: Build (unsigned)
        run: |
          xcodebuild \
            -project NovelReader.xcodeproj \
            -target NovelReader \
            -configuration Release \
            -sdk iphoneos \
            -derivedDataPath DerivedData \
            CODE_SIGNING_ALLOWED=NO \
            CODE_SIGNING_REQUIRED=NO \
            CODE_SIGN_IDENTITY="" \
            build

      - name: Package IPA
        run: |
          APP_PATH="DerivedData/Build/Products/Release-iphoneos/NovelReader.app"
          mkdir -p Payload
          cp -R "$APP_PATH" Payload/
          zip -r NovelReader-unsigned.ipa Payload/
          ls -lh NovelReader-unsigned.ipa

      - name: Upload artifact
        uses: actions/upload-artifact@v4
        with:
          name: NovelReader-unsigned-ipa
          path: NovelReader-unsigned.ipa
          retention-days: 30
