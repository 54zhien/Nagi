name: Build unsigned IPA

on:
  workflow_dispatch:
  push:
    branches: [ main, codex/reader-fluidity-refactor ]

jobs:
  build:
    runs-on: macos-15

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Show toolchain
        run: |
          xcodebuild -version
          xcodebuild -showsdks | grep -i ios

      - name: Select Xcode 26
        run: |
          sudo xcode-select -s /Applications/Xcode_26.3.app
          xcodebuild -version

      - name: Resolve package dependencies
        run: |
          xcodebuild \
            -resolvePackageDependencies \
            -project Nagi.xcodeproj \
            -scheme Nagi

      - name: Build (unsigned)
        run: |
          xcodebuild \
            -project Nagi.xcodeproj \
            -scheme Nagi \
            -configuration Release \
            -destination "generic/platform=iOS" \
            -derivedDataPath build \
            CODE_SIGNING_ALLOWED=NO \
            CODE_SIGNING_REQUIRED=NO \
            CODE_SIGN_IDENTITY="" \
            build

      - name: Package IPA
        run: |
          APP_PATH="build/Build/Products/Release-iphoneos/Nagi.app"
          mkdir -p Payload
          cp -R "$APP_PATH" Payload/
          zip -r Nagi-unsigned.ipa Payload/
          ls -lh Nagi-unsigned.ipa

      - name: Upload artifact
        uses: actions/upload-artifact@v4
        with:
          name: Nagi-unsigned-ipa
          path: Nagi-unsigned.ipa
          retention-days: 30
